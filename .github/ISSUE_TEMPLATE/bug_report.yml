name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal code/CLI command to reproduce.
      placeholder: |
        uv run chameleon scrape https://example.com --json
        # or Python snippet
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Affected interface
      options:
        - Python SDK
        - MCP Server
        - REST API
        - CLI
        - Deep crawler
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      description: |
        Include `status`, `metadata.engine`, and `metadata.escalation_level` from the result if applicable.
      render: text
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python version, install method (uv/pip)
    validations:
      required: true
