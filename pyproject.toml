[project]
name = "chameleon"
version = "0.1.0"
description = "AI Agent web scraping tool with layered anti-detection, adaptive degradation and agent-friendly output (MCP + REST + CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chameleon Contributors" }]
keywords = ["scraping", "crawler", "mcp", "agent", "anti-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "charset-normalizer>=3.3",
    "httpx[http2]>=0.27",
    "playwright>=1.62.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.3",
    "structlog>=24.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
cli = ["typer>=0.12"]
mcp = ["mcp>=1.2"]
rest = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]
queue = ["redis>=5.0", "arq>=0.26"]
proxy = ["redis>=5.0"]
captcha = ["ddddocr>=1.4.7"]
extract = ["selectolax>=0.3.21", "lxml>=5.2", "markdownify>=0.12", "readability-lxml>=0.8"]
tls = ["curl_cffi>=0.7"]
docs = ["litellm>=1.40"]

[project.scripts]
chameleon = "chameleon.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/chameleon"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: 需要外部资源（网络/Redis/浏览器）的集成测试",
    "browser: 需要 Playwright 的测试",
    "slow: 慢速测试",
]

[tool.coverage.run]
source = ["src/chameleon"]
