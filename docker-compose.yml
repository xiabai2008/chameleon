services:
  crawler:
    build: .
    ports:
      - "8000:8000"
      - "9100:9100"
    env_file: .env
    environment:
      - CHAMELEON_PROXY__POOL_TYPE=redis
      - CHAMELEON_PROXY__REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./config:/app/config

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "chameleon.interfaces.sdk", "worker"]
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./config:/app/config

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
