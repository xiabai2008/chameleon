# Chameleon 全局配置
# 优先级：环境变量(CHAMELEON_*) > 本文件 > 代码默认值
app_name: chameleon
debug: false
log_level: INFO
log_json: false

engine:
  http_timeout: 15.0
  browser_timeout: 45.0
  max_retries: 3
  min_content_length: 500
  browser_pool_size: 2
  browser_headless: true

proxy:
  enabled: false                        # 生产环境设为 true
  pool_type: static                     # static | redis（生产推荐 redis 分布式池）
  static_list: []                       # pool_type=static 时的手动代理列表
  # 生产环境示例：
  #   static_list:
  #     - "http://user:pass@proxy1:8080"
  #     - "http://user:pass@proxy2:8080"
  redis_url: "redis://localhost:6379/0" # pool_type=redis 的连接（需 docker-compose up redis）
  health_check_interval: 300
  min_score: 30
  default_score: 50

behavior:
  min_interval: 2.0
  max_interval: 10.0
  scroll_steps: 5
  scroll_delay: 0.8

crawl:
  default_max_pages: 50
  default_max_depth: 3
  concurrency: 8
  per_domain_qps: 2.0
  respect_robots: true

captcha:
  provider: ddddocr       # ddddocr | capsolver | twocaptcha | none
  api_key: ""
  auto_retry: 2

security:
  api_key: ""
  enable_ssrf_protection: true
  url_whitelist: []
  rate_limit_per_minute: 120

# 第三方服务兜底（P8-9）：自有引擎全失败时尝试
provider:
  enabled: false
  type: firecrawl           # firecrawl | brightdata | none
  api_key: ""
  base_url: https://api.firecrawl.dev
  customer: ""              # brightdata 客户号
  zone: web_unlocker
  zone_password: ""
  timeout: 60.0

# 验证码自训练（P8-8）：模板库模型
captcha_training:
  model_path: data/captcha_model.npz
  sample_dir: data/captcha_samples
  threshold: 0.7
